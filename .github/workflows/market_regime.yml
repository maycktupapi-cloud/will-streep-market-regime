name: Will Streep Market Regime

on:
  schedule:
    # Cada hora, al minuto 17
    - cron: "17 * * * *"

  # Permite ejecutarlo manualmente para probarlo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-regime:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Ejecutar Market Regime
        run: python market_regime.py

      - name: Guardar historial
        run: |
          if [ -f market_regime_historial.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market_regime_historial.csv
            git diff --cached --quiet || git commit -m "Actualizar Market Regime"
            git push
          fi
